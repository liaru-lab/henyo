    dependsOn "compileJava", "verifyPairingTotp", "verifyWebSocketProtocol"
    inputs.dir(classesDir)
    outputs.file(classesJar)
    doFirst {
        classesJar.delete()
    }
    commandLine "sh", "-c", "cd ${classesDir.absolutePath} && jar cf ${classesJar.absolutePath} ."
}

tasks.register("check") {
    dependsOn "verifyPairingTotp", "verifyWebSocketProtocol", "verifyWebSocketSessionPolicy", "verifyTermuxCommandBridge", "verifyConnectivityWatchdog", "verifyScreenshotCoordinateMapper", "verifyCursorMotionEasing", "verifyTaskProgressModel", "verifyTaskProgressContract", "verifyTaskProgressHelper", "verifyHelperSessionStatus", "verifyCompletionSummary", "verifyResponseSemantics", "verifyOpenUriContract", "verifySafeDeploy", "verifySkillCheckoutDiscovery", "verifySensitiveUiAccess"
