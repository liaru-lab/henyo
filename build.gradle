tasks.register("dex", Exec) {
    dependsOn "classesJar"
    inputs.file(classesJar)
    outputs.dir(dexDir)
    doFirst {
        delete(dexDir)
        dexDir.mkdirs()
    }
    commandLine "d8",
            "--min-api", minSdk,
            "--lib", compileAndroidJar,
            "--output", dexDir.absolutePath,
            classesJar.absolutePath
}

tasks.register("packageUnsigned", Exec) {
    dependsOn "dex"
    inputs.file(linkedApk)
    inputs.file("${dexDir.absolutePath}/classes.dex")
    outputs.file(unsignedApk)
    doFirst {
        Files.copy(linkedApk.toPath(), unsignedApk.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    commandLine "sh", "-c", "cd ${dexDir.absolutePath} && zip -q ${unsignedApk.absolutePath} classes.dex"
}

tasks.register("debugKeystore", Exec) {
    outputs.file(debugKeystore)
    onlyIf { !debugKeystore.exists() }
    doFirst {
        debugKeystore.parentFile.mkdirs()
    }
    commandLine "keytool",
            "-genkeypair",
            "-keystore", debugKeystore.absolutePath,
            "-storepass", "android",
            "-keypass", "android",
            "-alias", "androiddebugkey",
            "-keyalg", "RSA",
            "-keysize", "2048",
            "-validity", "10000",
            "-dname", "CN=Henyo Debug,O=liaru"
}

tasks.register("assembleDebug", Exec) {
    dependsOn "packageUnsigned", "debugKeystore"
    inputs.file(unsignedApk)
    inputs.file(debugKeystore)
    outputs.file(debugApk)
    doFirst {
        debugApk.delete()
    }
    commandLine "apksigner", "sign",
            "--ks", debugKeystore.absolutePath,
            "--ks-pass", "pass:android",
            "--key-pass", "pass:android",
            "--out", debugApk.absolutePath,
            unsignedApk.absolutePath
}

tasks.register("assembleRelease", Exec) {
    dependsOn "packageUnsigned"
    inputs.file(unsignedApk)
    outputs.file(releaseApk)
    outputs.upToDateWhen { false }
    doFirst {
        def required = [
                "HENYO_RELEASE_KEYSTORE",
                "HENYO_RELEASE_STORE_PASSWORD",
                "HENYO_RELEASE_KEY_PASSWORD",
                "HENYO_RELEASE_KEY_ALIAS",
        ]
        def missing = required.findAll { !System.getenv(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Release signing configuration is missing: ${missing.join(', ')}")
        }
        def releaseKeystore = file(System.getenv("HENYO_RELEASE_KEYSTORE"))
        if (!releaseKeystore.isFile()) {
            throw new GradleException("Release keystore does not exist: ${releaseKeystore}")
        }
        releaseApk.delete()
        commandLine "apksigner", "sign",
                "--ks", releaseKeystore.absolutePath,
                "--ks-pass", "env:HENYO_RELEASE_STORE_PASSWORD",
                "--key-pass", "env:HENYO_RELEASE_KEY_PASSWORD",
                "--ks-key-alias", System.getenv("HENYO_RELEASE_KEY_ALIAS"),
                "--out", releaseApk.absolutePath,
                unsignedApk.absolutePath
    }
}

tasks.register("clean") {
    doLast {
        delete(outDir)
    }
}
