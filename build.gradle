import java.nio.file.Files

def androidSdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
def compileAndroidJar = System.getenv("HENYO_COMPILE_ANDROID_JAR") ?:
        (androidSdkRoot ? "${androidSdkRoot}/platforms/android-35/android.jar" : "${projectDir}/sdk/android-35/android.jar")
def resourceAndroidJar = System.getenv("HENYO_RESOURCE_ANDROID_JAR") ?: compileAndroidJar
def appId = System.getenv("HENYO_APP_ID") ?: "link.liaru.henyo"
def versionCode = findProperty("henyoVersionCode") ?: System.getenv("HENYO_VERSION_CODE") ?: "1"
def versionName = findProperty("henyoVersionName") ?: System.getenv("HENYO_VERSION_NAME") ?: "0.1.0"
def minSdk = "26"
def targetSdk = "30"
def outDir = layout.buildDirectory.get().asFile
def genDir = file("${outDir}/generated")
def classesDir = file("${outDir}/classes")
def classesJar = file("${outDir}/classes.jar")
def dexDir = file("${outDir}/dex")
def resZip = file("${outDir}/compiled-res.zip")
def linkedApk = file("${outDir}/linked.apk")
def unsignedApk = file("${outDir}/henyo-unsigned.apk")
def debugApk = file("${outDir}/henyo-debug.apk")
def releaseApk = file("${outDir}/henyo-v${versionName}.apk")
def debugKeystore = System.getenv("HENYO_DEBUG_KEYSTORE")
        ? file(System.getenv("HENYO_DEBUG_KEYSTORE"))
        : file("${System.getProperty('user.home')}/.config/henyo/signing/${appId}-debug.keystore")

if (!(versionCode ==~ /[1-9][0-9]{0,9}/) || versionCode.toLong() > 2100000000L) {
    throw new GradleException("HENYO_VERSION_CODE must be in Android's positive version-code range")
}
if (!(versionName ==~ /[A-Za-z0-9][A-Za-z0-9.+_-]{0,63}/)) {
    throw new GradleException("HENYO_VERSION_NAME is invalid")
}

tasks.register("compileResources", Exec) {
    inputs.dir("src/main/res")
    outputs.file(resZip)
    doFirst {
        outDir.mkdirs()
        resZip.delete()
    }
    commandLine "aapt2", "compile", "--dir", "src/main/res", "-o", resZip.absolutePath
}

tasks.register("linkResources", Exec) {
    dependsOn "compileResources"
    inputs.file("src/main/AndroidManifest.xml")
    inputs.file(resZip)
    outputs.file(linkedApk)
    outputs.dir(genDir)
    doFirst {
        outDir.mkdirs()
        delete(genDir)
        genDir.mkdirs()
        linkedApk.delete()
    }
    commandLine "aapt2", "link",
            "-I", resourceAndroidJar,
            "--manifest", "src/main/AndroidManifest.xml",
            "--rename-manifest-package", appId,
            "--java", genDir.absolutePath,
            "--min-sdk-version", minSdk,
            "--target-sdk-version", targetSdk,
            "--version-code", versionCode,
            "--version-name", versionName,
            "-o", linkedApk.absolutePath,
            resZip.absolutePath
}

tasks.register("compileJava", Exec) {
    dependsOn "linkResources"
    inputs.dir("src/main/java")
    inputs.dir(genDir)
    outputs.dir(classesDir)
    doFirst {
        delete(classesDir)
        classesDir.mkdirs()
    }
    commandLine "sh", "-c", """
        find src/main/java ${genDir.absolutePath} -name '*.java' > ${outDir.absolutePath}/sources.txt &&
        javac -encoding UTF-8 -source 11 -target 11 \
          -classpath ${compileAndroidJar} \
          -d ${classesDir.absolutePath} \
          @${outDir.absolutePath}/sources.txt
    """
}

