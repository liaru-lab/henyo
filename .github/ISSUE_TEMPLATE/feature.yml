name: Feature proposal
description: Propose a focused change to Henyo.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this change provide?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this useful, and what currently prevents it?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Describe what is in scope and what is explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the work complete.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Describe automated checks and any required device verification.
    validations:
      required: true
