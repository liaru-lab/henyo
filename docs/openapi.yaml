openapi: 3.1.0
info:
  title: Henyo Control API
  version: 1.0.0
  description: |
    Local device UI control API for Henyo accessibility backends.

    Remote access is disabled by default. The default listener is
    `127.0.0.1:8765`, which keeps existing Termux-on-device workflows local.
    When remote access is explicitly enabled, the service may bind to a
    non-loopback address and accepts remote requests only from configured
    allowed CIDRs. The default allowed Tailnet CIDRs are `100.64.0.0/10` and
    `fd7a:115c:a1e0::/48`.

    Tailnet source IP is a network admission check only. It is never sufficient
    authentication for control APIs. Remote control requests from allowed CIDRs
    must include `Authorization: Bearer <token>`. Tokens are registered through
    a pairing session that is started locally on the Android device and
    confirmed with a short-lived, screen-visible 6-digit TOTP PIN. During the
    migration to pairing, `POST /v1/auth/tokens/local` is a localhost-only
    bootstrap endpoint that returns a raw token exactly once.
servers:
  - url: http://127.0.0.1:8765
tags:
  - name: limited-health
    description: Limited status endpoints available on localhost and allowed remote CIDRs.
  - name: local-management
    description: Localhost-only management endpoints for remote access settings and pairing lifecycle.
  - name: remote-pairing
    description: Pairing endpoints reachable from allowed remote CIDRs during an active pairing window.
  - name: authenticated-control
    description: UI/device control endpoints. Remote clients require Bearer auth in addition to allowed source CIDR.
  - name: token-management
    description: Token inventory and revocation endpoints. Remote clients require Bearer auth in addition to allowed source CIDR.
paths:
  /v1/health:
    get:
      tags: [limited-health]
      operationId: health
      description: |
        Limited service status. This endpoint is available on localhost. When
        remote access is enabled, allowed CIDRs may call it without Bearer auth
        so clients can discover service state. It must not expose raw tokens,
        pairing secrets, TOTP PINs, UI tree payloads, or screenshots.
      x-henyo-endpoint-class: limited-health
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: allowed-without-bearer
        otherAddresses: denied
      responses:
        "200":
          description: Service status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
  /v1/remote/access:
    get:
      tags: [local-management]
      operationId: remoteAccessStatus
      description: |
        Returns the configured and effective remote access state. This
        management endpoint is localhost-only.
      x-henyo-endpoint-class: local-only-management
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: denied
        otherAddresses: denied
      responses:
        "200":
          description: Remote access status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccessStatusResponse"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
    put:
      tags: [local-management]
      operationId: remoteAccessUpdate
      description: |
        Updates remote access settings. Remote access remains disabled unless
        explicitly enabled here or through the Android UI. This endpoint is
        localhost-only.
      x-henyo-endpoint-class: local-only-management
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: denied
        otherAddresses: denied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteAccessUpdateRequest"
      responses:
        "200":
          description: Updated remote access status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccessStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
  /v1/remote/pairing:
    get:
      tags: [remote-pairing]
      operationId: pairingStatus
      description: |
        Returns pairing state without exposing the raw pairing secret or current
        PIN. Remote clients use the public pairing id from this response while
        the Android screen supplies the 6-digit PIN.
      x-henyo-endpoint-class: pairing-status
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: allowed-without-bearer-auth
        otherAddresses: denied
      responses:
        "200":
          description: Pairing status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingStatusResponse"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
    post:
      tags: [local-management]
      operationId: pairingStart
      description: |
        Starts a short-lived pairing session and causes the Android UI to show a
        6-digit TOTP PIN with a countdown ring and next-code hint. The PIN is
        screen-visible only and is never returned by this API. This management
        endpoint is localhost-only.
      x-henyo-endpoint-class: local-only-management
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: denied
        otherAddresses: denied
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingStartRequest"
      responses:
        "200":
          description: Active pairing status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingStatusResponse"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [local-management]
      operationId: pairingCancel
      description: Cancels the active pairing session. This management endpoint is localhost-only.
      x-henyo-endpoint-class: local-only-management
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: denied
        otherAddresses: denied
      responses:
        "200":
          description: Pairing status after cancellation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingStatusResponse"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
  /v1/remote/pairing/register:
    post:
      tags: [remote-pairing]
      operationId: pairingRegisterToken
      description: |
        Registers a remote client token during an active pairing session. The
        request must come from an allowed remote CIDR; this is intentionally not
        a localhost compatibility endpoint. Remote access must be enabled. The
        request is authorized by the active pairing id plus the screen-visible
        6-digit TOTP PIN, not by Tailnet source IP alone. The Python CLI can
        fetch the public pairing id automatically, so users normally type only
        the visible PIN. To tolerate agent latency, Henyo accepts the current
        code, the displayed next code, and the six preceding 30-second codes.
        The raw Bearer token is returned exactly once in this response and must
        never be logged.
      x-henyo-endpoint-class: remote-pairing
      x-henyo-access:
        localhost: denied
        allowedRemoteCidrs: allowed-with-active-pairing-pin
        otherAddresses: denied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingRegisterRequest"
      responses:
        "200":
          description: Newly registered token. The raw token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
        "409":
          $ref: "#/components/responses/PairingUnavailable"
        "429":
          $ref: "#/components/responses/TooManyPairingAttempts"
  /v1/auth/tokens:
    get:
      tags: [token-management]
      operationId: tokenList
      description: |
        Lists stored token metadata without raw token values. Localhost may call
        this endpoint directly. Remote callers must come from an allowed CIDR
        and present a valid Bearer token.
      security:
        - bearerAuth: []
      x-henyo-endpoint-class: token-management
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: requires-bearer
        otherAddresses: denied
      responses:
        "200":
          description: Token metadata list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenListResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
  /v1/auth/tokens/local:
    post:
      tags: [local-management]
      operationId: localTokenCreate
      description: |
        Temporary localhost-only bootstrap endpoint for creating a Bearer token
        before the pairing UI is implemented. It returns the raw Bearer token
        exactly once and stores only token metadata plus a verifier/hash. Remote
        callers are always denied by source policy.
      x-henyo-endpoint-class: local-only-management
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: denied
        otherAddresses: denied
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalTokenCreateRequest"
      responses:
        "200":
          description: Newly created local bootstrap token. The raw token is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
  /v1/auth/tokens/{tokenId}:
    delete:
      tags: [token-management]
      operationId: tokenRevoke
      description: |
        Revokes a token immediately. Localhost may call this endpoint directly.
        Remote callers must come from an allowed CIDR and present a valid Bearer
        token.
      security:
        - bearerAuth: []
      x-henyo-endpoint-class: token-management
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: requires-bearer
        otherAddresses: denied
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoke result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/app/current:
    get:
      tags: [authenticated-control]
      operationId: appCurrent
      security:
        - bearerAuth: []
      x-henyo-endpoint-class: authenticated-control
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: requires-bearer
        otherAddresses: denied
      responses:
        "200":
          description: Current foreground app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCurrentResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
  /v1/app/launch:
    post:
      tags: [authenticated-control]
      operationId: appLaunch
      security:
        - bearerAuth: []
      x-henyo-endpoint-class: authenticated-control
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: requires-bearer
        otherAddresses: denied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppLaunchRequest"
      responses:
        "200":
          description: Launch result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
  /v1/app/start:
    post:
      tags: [authenticated-control]
      operationId: appStart
      security:
        - bearerAuth: []
      x-henyo-endpoint-class: authenticated-control
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: requires-bearer
        otherAddresses: denied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppStartRequest"
      responses:
        "200":
          description: Start result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
  /v1/ui/tree:
    get:
      tags: [authenticated-control]
      operationId: uiTree
      security:
        - bearerAuth: []
      x-henyo-endpoint-class: authenticated-control
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: requires-bearer
        otherAddresses: denied
      parameters:
        - $ref: "#/components/parameters/MaxDepth"
        - $ref: "#/components/parameters/MaxNodes"
        - $ref: "#/components/parameters/OnlyTextNodes"
        - $ref: "#/components/parameters/Redact"
      responses:
        "200":
          description: UI tree or flat text-node list.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TreeResponse"
                  - $ref: "#/components/schemas/FlatTreeResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
  /v1/ui/find:
    post:
      tags: [authenticated-control]
      operationId: uiFind
      security:
        - bearerAuth: []
      x-henyo-endpoint-class: authenticated-control
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: requires-bearer
        otherAddresses: denied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindRequest"
      responses:
        "200":
          description: Matched node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
  /v1/ui/click:
    post:
      tags: [authenticated-control]
      operationId: uiClick
      security:
        - bearerAuth: []
      x-henyo-endpoint-class: authenticated-control
      x-henyo-access:
        localhost: allowed
