  /v1/global/home:
    post:
      tags: [authenticated-control]
      operationId: globalHome
      security:
        - bearerAuth: []
      x-henyo-endpoint-class: authenticated-control
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: requires-bearer
        otherAddresses: denied
      responses:
        "200":
          description: Home action result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
      description: |
        Required for remote control and token-management requests from allowed
        CIDRs. Localhost compatibility is expressed by each operation's
        `x-henyo-access` extension because OpenAPI security schemes cannot
        model source-address-dependent auth. Generic OpenAPI clients may treat
        Bearer auth as required for all sources; Henyo implementations must use
        `x-henyo-access` as the source-of-truth access policy.
  parameters:
    MaxDepth:
      name: maxDepth
      in: query
      schema:
        type: integer
        default: 8
        minimum: 0
    MaxNodes:
      name: maxNodes
      in: query
      schema:
        type: integer
        default: 500
        minimum: 1
    OnlyTextNodes:
      name: onlyTextNodes
      in: query
      schema:
        type: boolean
        default: false
    Redact:
      name: redact
      in: query
      schema:
        type: boolean
        default: false
  responses:
    AuthError:
      description: Missing, malformed, expired, revoked, or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthErrorResponse"
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current service state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenBySource:
      description: Source address is not allowed for this endpoint class.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PairingUnavailable:
      description: No usable pairing session, or another pairing session is already active.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthErrorResponse"
    TooManyPairingAttempts:
      description: Pairing PIN failure rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthErrorResponse"
  schemas:
    ErrorCode:
      type: string
      enum:
        - bad_request
        - remote_access_disabled
        - source_not_allowed
        - auth_required
        - auth_malformed
        - auth_invalid
        - auth_revoked
        - pairing_required
        - pairing_expired
        - pairing_cancelled
        - pairing_used
        - pairing_already_active
        - pairing_pin_invalid
        - pairing_rate_limited
        - not_found
        - conflict
    ErrorResponse:
      type: object
      required: [ok, error, code]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
    AuthErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            auth:
              type: object
              properties:
                required:
                  type: boolean
                scheme:
                  type: string
                  enum: [Bearer, pairing-pin]
                sourceAllowed:
                  type: boolean
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
    HealthResponse:
      type: object
      required: [ok, service, lastEventTime]
      properties:
        ok:
          type: boolean
        service:
          type: string
        lastEventTime:
          type: integer
          format: int64
        remoteAccess:
          $ref: "#/components/schemas/RemoteAccessSummary"
    RemoteAccessSummary:
      type: object
      required: [enabled, bindHost, bindPort, allowedCidrs]
      properties:
        enabled:
          type: boolean
          default: false
          description: Remote access is disabled by default.
        bindHost:
          type: string
          default: 127.0.0.1
          description: Actual listener host currently serving requests. Localhost is the default.
        bindPort:
          type: integer
          default: 8765
        allowedCidrs:
          type: array
          description: Source CIDRs allowed to reach remote-enabled endpoints.
          default: ["100.64.0.0/10", "fd7a:115c:a1e0::/48"]
          items:
            type: string
        activePairing:
          type: boolean
          description: True when a pairing session is active. Does not expose PINs or secrets.
        tokenCount:
          type: integer
          minimum: 0
          description: Count of stored token records, excluding raw token values.
        remoteServing:
          type: boolean
          description: True only when the runtime listener is actually serving remote clients.
    RemoteAccessStatusResponse:
      type: object
      required: [ok, remoteAccess, endpointClasses]
      properties:
        ok:
          type: boolean
        remoteAccess:
          allOf:
            - $ref: "#/components/schemas/RemoteAccessSummary"
            - type: object
              properties:
                configuredBindHost:
                  type: string
                  default: 127.0.0.1
                effectiveBindHost:
                  type: string
                  default: 127.0.0.1
                  description: Actual listener host currently serving requests.
                desiredBindHost:
                  type: string
                  default: 127.0.0.1
                  description: Config-derived bind host requested by remote access settings.
                remoteServing:
                  type: boolean
                  description: True only when the runtime listener is actually serving remote clients.
                effectiveRemoteEnabled:
                  type: boolean
                  description: True only when remote settings are enabled and the runtime listener is serving remote clients.
                localOnlyManagement:
                  type: boolean
                  const: true
                  description: Management endpoints remain localhost-only even when remote access is enabled.
        endpointClasses:
          type: array
          items:
            $ref: "#/components/schemas/EndpointClassPolicy"
    RemoteAccessUpdateRequest:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
        bindHost:
          type: string
          default: 127.0.0.1
          description: Non-loopback values are effective only when remote access is explicitly enabled.
        bindPort:
          type: integer
          default: 8765
          minimum: 1
          maximum: 65535
        allowedCidrs:
          type: array
          default: ["100.64.0.0/10", "fd7a:115c:a1e0::/48"]
          items:
            type: string
          description: Remote source CIDRs admitted before endpoint auth is evaluated.
    EndpointClassPolicy:
      type: object
      required: [className, localhost, allowedRemoteCidrs, otherAddresses]
      properties:
        className:
          type: string
          enum:
            - local-only-management
            - pairing-status
            - remote-pairing
            - authenticated-control
            - limited-health
            - token-management
        localhost:
          type: string
        allowedRemoteCidrs:
          type: string
        otherAddresses:
          type: string
    PairingStartRequest:
      type: object
      properties:
        ttlSeconds:
          type: integer
          default: 300
          minimum: 30
          maximum: 900
        clientHint:
          type: string
          description: Optional label shown locally while waiting for registration.
    PairingStatusResponse:
      type: object
      required: [ok, active]
      properties:
        ok:
          type: boolean
        active:
          type: boolean
        pairingId:
          type: string
          description: Public pairing identifier. Not a secret.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        pinDigits:
          type: integer
          const: 6
          description: The API reports PIN length only. The PIN is shown on the Android screen.
        attemptsRemaining:
          type: integer
          minimum: 0
        state:
          type: string
          enum: [inactive, active, expired, cancelled, used, locked]
    PairingRegisterRequest:
      type: object
      required: [pairingId, pin, clientName]
      properties:
        pairingId:
          type: string
        pin:
          type: string
          pattern: "^[0-9]{6}$"
          description: Screen-visible 6-digit TOTP PIN from the Android device.
        clientName:
          type: string
          minLength: 1
          maxLength: 80
        requestedScopes:
          type: array
          default: [control]
          items:
            type: string
            enum: [control, token-management]
    LocalTokenCreateRequest:
      type: object
      properties:
        name:
          type: string
          default: local-management
          minLength: 1
          maxLength: 80
          description: Local display name for the bootstrap token.
        requestedScopes:
          type: array
          default: [control, token-management]
          items:
            type: string
            enum: [control, token-management]
    TokenMetadata:
      type: object
      required: [id, name, scopes, createdAt, revoked]
      properties:
        id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [control, token-management, termux-command, sensitive-ui-control]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        lastSourceAddress:
          type: string
          description: Last observed source address, for audit display only.
        revoked:
          type: boolean
        revokedAt:
          type: string
          format: date-time
    TokenRegistrationResponse:
      type: object
      required: [ok, token, tokenType, tokenMetadata]
      properties:
        ok:
          type: boolean
        token:
          type: string
          description: Raw Bearer token returned exactly once. Store only a hash server-side.
        tokenType:
          type: string
          const: Bearer
        tokenMetadata:
          $ref: "#/components/schemas/TokenMetadata"
    TokenListResponse:
      type: object
      required: [ok, tokens]
      properties:
        ok:
          type: boolean
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/TokenMetadata"
    AppCurrentResponse:
      type: object
      required: [ok, package, className]
      properties:
        ok:
          type: boolean
        package:
          type: string
        className:
          type: string
        error:
          type: string
    AppLaunchRequest:
      type: object
      required: [package]
      properties:
        package:
          type: string
    AppStartRequest:
      type: object
      required: [component]
      properties:
        component:
          type: string
    Selector:
      type: object
      properties:
        text:
          type: string
        field:
          type: string
          enum: [text, desc, viewId, any]
          default: any
        exact:
          type: boolean
          default: false
        clickableOnly:
          type: boolean
          default: false
        visibleOnly:
          type: boolean
          default: true
    Node:
      type: object
      properties:
        text:
          type: string
        desc:
          type: string
        viewId:
          type: string
        className:
          type: string
        clickable:
          type: boolean
        editable:
          type: boolean
        focused:
          type: boolean
        enabled:
          type: boolean
        bounds:
          type: string
          description: Comma-separated left,top,right,bottom screen coordinates.
        centerX:
          type: integer
        centerY:
          type: integer
        depth:
          type: integer
        index:
          type: integer
        children:
          type: array
          items:
            $ref: "#/components/schemas/Node"
    TreeResponse:
      type: object
      required: [ok, root, truncated]
      properties:
        ok:
          type: boolean
        root:
          $ref: "#/components/schemas/Node"
        truncated:
          type: boolean
    FlatTreeResponse:
      type: object
      required: [ok, nodes, truncated]
      properties:
        ok:
          type: boolean
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        truncated:
          type: boolean
    FindRequest:
      type: object
      required: [selector]
      properties:
        selector:
          $ref: "#/components/schemas/Selector"
        redact:
          type: boolean
          default: false
    ClickRequest:
      type: object
      properties:
        selector:
          $ref: "#/components/schemas/Selector"
        x:
          type: integer
          description: Direct click x coordinate. Requires `y`.
        y:
          type: integer
          description: Direct click y coordinate. Requires `x`.
        bounds:
          type: string
          description: Comma-separated left,top,right,bottom bounds. Clicks the center point.
        redact:
          type: boolean
          default: false
    NodeResponse:
      type: object
      required: [ok, node]
      properties:
        ok:
          type: boolean
        node:
          $ref: "#/components/schemas/Node"
        error:
          type: string
        texts:
          type: array
          items:
            type: string
    ClickResponse:
      type: object
      required: [ok, strategy]
      properties:
        ok:
          type: boolean
        strategy:
          type: string
          enum: [node, clickable_parent, tap, coordinate]
        error:
          type: string
    SetTextRequest:
      type: object
      required: [value]
      properties:
        selector:
          $ref: "#/components/schemas/Selector"
        value:
          type: string
        clear:
          type: boolean
          default: true
    TapRequest:
      type: object
      required: [x, y]
      properties:
        x:
          type: integer
        y:
          type: integer
        coordinateSpace:
          type: string
          enum: [screen, screenshot]
          default: screen
        captureId:
          type: string
          description: Required when coordinateSpace is screenshot; returned with the source capture.
    SwipeRequest:
      type: object
      required: [x1, y1, x2, y2]
      properties:
        x1:
          type: integer
        y1:
          type: integer
        x2:
          type: integer
        y2:
          type: integer
        duration:
          type: integer
          default: 300
        coordinateSpace:
          type: string
          enum: [screen, screenshot]
          default: screen
        captureId:
          type: string
          description: Required when coordinateSpace is screenshot; returned with the source capture.
    ScrollRequest:
      type: object
      properties:
        direction:
          type: string
          enum: [down, up]
          default: down
        duration:
          type: integer
          default: 350
    ScrollUntilRequest:
      allOf:
        - $ref: "#/components/schemas/FindRequest"
        - type: object
          properties:
            attempts:
              type: integer
              default: 8
            interval:
              type: integer
              default: 250
            direction:
              type: string
              enum: [down, up]
              default: down
    ScrollUntilResponse:
      type: object
      required: [ok, attempts, node]
      properties:
        ok:
          type: boolean
        attempts:
          type: integer
        node:
          $ref: "#/components/schemas/Node"
        error:
          type: string
        texts:
          type: array
          items:
            type: string
    WaitRequest:
      allOf:
        - $ref: "#/components/schemas/FindRequest"
        - type: object
          properties:
            timeout:
              type: integer
              default: 5000
            interval:
              type: integer
              default: 100
            gone:
              type: boolean
              default: false
    GoneResponse:
      type: object
      required: [ok, gone]
      properties:
        ok:
          type: boolean
        gone:
          type: boolean
