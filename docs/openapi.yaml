  /v1/screen/screenshot:
    get:
      tags: [authenticated-control]
      operationId: screenScreenshot
      security:
        - bearerAuth: []
      x-henyo-endpoint-class: authenticated-control
      x-henyo-access:
        localhost: allowed
        allowedRemoteCidrs: requires-bearer
        otherAddresses: denied
      parameters:
        - name: timeout
          in: query
          schema:
            type: integer
            default: 5000
            minimum: 1
      responses:
        "200":
          description: PNG screenshot bytes. The service does not persist this image.
          headers:
            X-Henyo-Capture-Id:
              description: Short-lived id used with screenshot-coordinate gestures.
              schema: {type: string}
            X-Henyo-Capture-Bounds:
              description: Comma-separated left,top,right,bottom bounds in screen pixels.
              schema: {type: string}
            X-Henyo-Capture-Scale:
              description: Comma-separated screenshot-to-screen X and Y scale.
              schema: {type: string}
            X-Henyo-Mapping-Certain:
              description: Whether Henyo will accept this mapping for a gesture.
              schema: {type: boolean}
          content:
            image/png:
              schema:
                type: string
                format: binary
        "500":
          description: Screenshot failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/AuthError"
        "403":
          $ref: "#/components/responses/ForbiddenBySource"
